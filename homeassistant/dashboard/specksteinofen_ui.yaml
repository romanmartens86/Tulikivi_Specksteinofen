# ==============================================================================
# Lovelace Dashboard: Tulikivi Specksteinofen
# Du kannst diesen YAML-Block direkt als Ansicht (View) oder als vertikalen Stapel
# in dein Home Assistant Dashboard einfügen.
# ==============================================================================

type: vertical-stack
title: "🪵 Tulikivi Specksteinofen"
cards:
  # 1. Großer Status-Header
  - type: entity
    entity: sensor.speckstein_ofen_status
    name: "Aktueller Betriebsstatus"
    icon: mdi:fireplace

  # 2. Haupt-Anzeige: Speicherladezustand (Gauge) & Energie
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.speckstein_speicherladung
        name: "Wärmespeicher"
        unit: "%"
        needle: true
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 25
          red: 85

      - type: gauge
        entity: sensor.speckstein_gespeicherte_energie
        name: "Gespeicherte Energie"
        unit: "kWh"
        needle: true
        min: 0
        max: 50
        severity:
          green: 15
          yellow: 8
          red: 35

  # 3. Live-Temperaturen & Leistungswerte
  - type: glance
    title: "Live-Messwerte & Kapazität"
    show_state: true
    show_name: true
    entities:
      - entity: sensor.tulikivi_specksteinofen_rauchrohr_temperatur
        name: "Rauchrohr"
        icon: mdi:fire
      - entity: sensor.tulikivi_specksteinofen_speckstein_temperatur
        name: "Speckstein"
        icon: mdi:radiator
      - entity: sensor.speckstein_max_kapazitaet_kwh
        name: "Max. Kapazität"
        icon: mdi:battery-high
      - entity: sensor.speckstein_restwaerme_stunden
        name: "Restwärme ca."
        icon: mdi:timer-sand

  # 4. 24-Stunden Temperaturverlauf (Phasenverschiebung)
  - type: history-graph
    title: "24h Abbrand & Wärme-Phasenverschiebung"
    hours_to_show: 24
    refresh_interval: 10
    entities:
      - entity: sensor.tulikivi_specksteinofen_rauchrohr_temperatur
        name: "Rauchrohr"
      - entity: sensor.tulikivi_specksteinofen_speckstein_temperatur
        name: "Speckstein Außen"

  # 5. Ofen-Konfiguration (Hier Gewicht wie 1000kg oder 2600kg einstellen!)
  - type: entities
    title: "⚙️ Ofen-Konfiguration & Parameter"
    show_header_toggle: false
    entities:
      - entity: input_number.speckstein_masse
        name: "Ofen-Gewicht (z.B. 1000 oder 2600 kg)"
      - entity: input_text.speckstein_raum_sensor_entity
        name: "Raumtemperatur Sensor-Entität (z.B. sensor.wohnzimmer_temperatur)"
      - entity: input_number.speckstein_min_temp
        name: "Feste Basis-Raumtemperatur (Fallback)"
      - entity: input_number.speckstein_max_temp
        name: "100% Temperatur-Grenze (Gelernt)"
      - entity: input_boolean.speckstein_auto_learn
        name: "Höchstwert automatisch anlernen"
