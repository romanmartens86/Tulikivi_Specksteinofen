# ==============================================================================
# Lovelace Dashboard-Karte: Tulikivi Specksteinofen
# 
# VARIANTE 1: DIREKT IM KARTEN-PICKER (Empfohlen!)
# Klicke im Dashboard einfach auf "Karte hinzufügen" -> "Tulikivi Specksteinofen" auswählen!
# Im YAML-Modus entspricht das einfach:
# ------------------------------------------------------------------------------
# type: custom:tulikivi-specksteinofen-card
# ------------------------------------------------------------------------------
#
# VARIANTE 2: MANUELLER STACK (Aus Einzel-Karten)
# Einfügen über: Dashboard bearbeiten -> Karte hinzufügen -> Ganz unten "Manuell"
# ==============================================================================

type: vertical-stack
cards:
  # 1. Dynamischer Status-Header mit Klappen-Warnung & Farbwechsel
  - type: custom:mushroom-template-card
    entity: sensor.tulikivi_specksteinofen_betriebsstatus
    primary: >-
      {{ states('sensor.tulikivi_specksteinofen_betriebsstatus') }} ·
      {{ states('sensor.tulikivi_specksteinofen_speicherladung') | int(0) }} % geladen
    secondary: >-
      {% set st = states('sensor.tulikivi_specksteinofen_betriebsstatus') %}
      {% if 'Glutphase' in st %}
      ⚠️ Jetzt Luftklappe schließen, um Wärme im Stein zu halten!
      {% else %}
      Rauchgas: {{ states('sensor.tulikivi_specksteinofen_rauchrohr_temperatur') | float(0) | round(1) }} °C ·
      Stein: {{ states('sensor.tulikivi_specksteinofen_speckstein_temperatur') | float(0) | round(1) }} °C ·
      Raum: {{ states('sensor.netatmo_wohnzimmer_temperatur') | float(0) | round(1) }} °C
      {% endif %}
    icon: >-
      {% set st = states('sensor.tulikivi_specksteinofen_betriebsstatus') %}
      {% if st == 'Voller Abbrand' %}mdi:fire
      {% elif st == 'Anheizen' %}mdi:fire-alert
      {% elif 'Glutphase' in st %}mdi:alert-decagram
      {% elif 'Wärmeabgabe' in st %}mdi:radiator
      {% else %}mdi:fireplace-off{% endif %}
    icon_color: >-
      {% set st = states('sensor.tulikivi_specksteinofen_betriebsstatus') %}
      {% if st == 'Voller Abbrand' %}deep-orange
      {% elif st == 'Anheizen' %}amber
      {% elif 'Glutphase' in st %}red
      {% elif 'Wärmeabgabe' in st %}orange
      {% else %}grey{% endif %}

  # 2. Tachos für Speicherladung (auch > 100%) & Gespeicherte Wärmemenge (kWh)
  - type: horizontal-stack
    cards:
      - type: gauge
        entity: sensor.tulikivi_specksteinofen_speicherladung
        name: Speicherladung
        unit: "%"
        needle: true
        min: 0
        max: 120
        segments:
          - from: 0
            color: "#546e7a"
          - from: 20
            color: "#42a5f5"
          - from: 45
            color: "#66bb6a"
          - from: 80
            color: "#ffa726"
          - from: 100
            color: "#ef5350"

      - type: gauge
        entity: sensor.tulikivi_specksteinofen_gespeicherte_warme
        name: Wärmemenge
        unit: kWh
        needle: true
        min: 0
        max: 15
        segments:
          - from: 0
            color: "#546e7a"
          - from: 2
            color: "#42a5f5"
          - from: 5
            color: "#66bb6a"
          - from: 10
            color: "#ffa726"
          - from: 12
            color: "#ef5350"

  # 3. Live-Temperaturen (Rauchgas & Speckstein)
  - type: horizontal-stack
    cards:
      - type: tile
        entity: sensor.tulikivi_specksteinofen_rauchrohr_temperatur
        name: Rauchgas
        icon: mdi:fire
        color: deep-orange
      - type: tile
        entity: sensor.tulikivi_specksteinofen_speckstein_temperatur
        name: Speckstein
        icon: mdi:radiator
        color: orange

  # 4. Restwärme-Prognose & 100%-Kapazitätsinfo
  - type: custom:mushroom-template-card
    entity: sensor.tulikivi_specksteinofen_restwarmedauer
    primary: >-
      Restwärme: ca. {{ states('sensor.tulikivi_specksteinofen_restwarmedauer') | float(0) | round(1) }} Std.
      ({{ states('sensor.tulikivi_specksteinofen_gespeicherte_warme') | float(0) | round(2) }} kWh)
    secondary: >-
      100%-Kapazität: {{ states('sensor.tulikivi_specksteinofen_max_speicherkapazitat') | float(0) | round(2) }} kWh
      (bei {{ states('number.tulikivi_specksteinofen_maximale_speichertemperatur') | float(65) | round(1) }} °C Stein)
    icon: mdi:timer-sand
    icon_color: teal

  # 5. 24-Stunden Verlauf mit 2 Y-Achsen (für perfekte Sichtbarkeit der Phasenverschiebung)
  - type: custom:mini-graph-card
    name: Abbrand & Phasenverschiebung (24h)
    icon: mdi:chart-bell-curve-cumulative
    hours_to_show: 24
    points_per_hour: 4
    decimals: 1
    line_width: 3
    entities:
      - entity: sensor.tulikivi_specksteinofen_rauchrohr_temperatur
        name: Rauchgas (°C)
        color: "#ff5722"
      - entity: sensor.tulikivi_specksteinofen_speckstein_temperatur
        name: Speckstein (°C)
        color: "#ffa726"
        y_axis: secondary
    show:
      labels: true
      labels_secondary: true
      legend: true
      icon: true

  # 6. Kalibrierung & Auto-Learn Steuerung
  - type: horizontal-stack
    cards:
      - type: tile
        entity: switch.tulikivi_specksteinofen_automatisches_lernen_auto_learn
        name: Auto-Learn
        icon: mdi:school
        color: amber
      - type: tile
        entity: number.tulikivi_specksteinofen_maximale_speichertemperatur
        name: 100% Max-Temp.
        icon: mdi:thermometer-chevron-up
        color: red
